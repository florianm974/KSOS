<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>KSOS — Portail de jeux & projets</title>
    <meta
      name="description"
      content="Portail regroupant les jeux et projets du collectif KSOS, développeurs passionnés à La Réunion."
    />

    <!-- SEO & Réseaux Sociaux (Open Graph / Twitter Cards) -->
    <meta property="og:title" content="KSOS — Portail de jeux & projets" />
    <meta
      property="og:description"
      content="Découvrez les jeux et projets du collectif KSOS, développeurs passionnés à La Réunion."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://florianm974.github.io/KSOS/" />
    <meta
      property="og:image"
      content="https://florianm974.github.io/KSOS/assets/og-ksos.svg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://florianm974.github.io/KSOS/assets/og-ksos.svg"
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="./style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Fond subtil -->
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="container">
      <!-- HERO -->
      <header class="hero">
        <h1 class="hero-title">KSOS</h1>
        <p class="hero-subtitle">
          Collectif de développeurs — jeux et projets réunis en un seul endroit
        </p>
        <div id="members-container" class="members" aria-label="Membres du collectif"></div>
      </header>

      <!-- RECHERCHE -->
      <div class="search-wrap">
        <input
          id="search"
          type="search"
          placeholder="Rechercher un jeu, un outil, un auteur…"
          aria-label="Rechercher un projet"
        />
      </div>

      <!-- SECTION JEUX -->
      <section class="section" aria-labelledby="games-title">
        <div class="section-head">
          <h2 id="games-title" class="section-title">Jeux</h2>
          <span id="games-count" class="section-count" aria-live="polite"></span>
        </div>
        <div id="games-chips" class="chips" role="group" aria-label="Filtrer les jeux par catégorie"></div>
        <p id="games-results" class="results-info" role="status" aria-live="polite"></p>
        <div id="games-container" class="grid"></div>
      </section>

      <!-- SECTION OUTILS & PROJETS -->
      <section class="section" aria-labelledby="projects-title">
        <div class="section-head">
          <h2 id="projects-title" class="section-title">Outils</h2>
          <span id="projects-count" class="section-count" aria-live="polite"></span>
        </div>
        <p id="projects-results" class="results-info" role="status" aria-live="polite"></p>
        <div id="projects-container" class="grid"></div>
      </section>

      <!-- FOOTER -->
      <footer class="footer">
        <p class="footer-copy">© <span id="current-year"></span> KSOS</p>
        <div id="footer-links" class="footer-links"></div>
      </footer>
    </main>

    <script src="./app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
