  <text x="600" y="290" font-family="Arial, sans-serif" font-size="200" font-weight="900" text-anchor="middle" fill="url(#text)" letter-spacing="-8">KSOS</text>

  <text x="600" y="390" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="#cbd5e1" letter-spacing="6">PORTAIL DE JEUX &amp; PROJETS</text>
  <text x="600" y="455" font-family="Arial, sans-serif" font-size="30" font-weight="500" text-anchor="middle" fill="#94a3b8" letter-spacing="2">Collectif de développeurs — La Réunion</text>

  <circle cx="600" cy="505" r="8" fill="#f0b429"/>
